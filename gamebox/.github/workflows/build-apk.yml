name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing Android platform files
        run: flutter create --platforms=android --project-name=gamebox --org com.example .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK with version and build number
        run: |
          mkdir -p renamed
          cp build/app/outputs/flutter-apk/app-release.apk \
             renamed/GameBox-v1.0.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBox-v1.0.${{ github.run_number }}
          path: renamed/GameBox-v1.0.${{ github.run_number }}.apk
