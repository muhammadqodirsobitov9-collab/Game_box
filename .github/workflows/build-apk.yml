name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: gamebox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup pubspec before flutter create
        run: cp pubspec.yaml pubspec.yaml.bak

      - name: Generate missing Android platform files
        run: flutter create --platforms=android --project-name=gamebox --org com.example .

      - name: Restore original pubspec
        run: mv pubspec.yaml.bak pubspec.yaml

      - name: Force Android compileSdk and targetSdk to 36
        run: |
          # build.gradle (Groovy) uchun
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/targetSdkVersion.*/targetSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle
          fi
          # build.gradle.kts (Kotlin script) uchun
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk =.*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk =.*/targetSdk = 36/' android/app/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean build cache
        run: flutter clean

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK with version and build number
        run: |
          mkdir -p renamed
          cp build/app/outputs/flutter-apk/app-release.apk \
             renamed/GameBox-v1.0.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBox-v1.0.${{ github.run_number }}
          path: gamebox/renamed/GameBox-v1.0.${{ github.run_number }}.apk
          
