name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: gamebox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup pubspec before flutter create
        run: cp pubspec.yaml pubspec.yaml.bak

      - name: Generate missing Android platform files
        run: flutter create --platforms=android --project-name=gamebox --org com.example .

      - name: Restore original pubspec
        run: mv pubspec.yaml.bak pubspec.yaml

      - name: Force compileSdk and targetSdk to 36 across all Gradle files
        run: |
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk =.*/compileSdk = 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk [0-9]*/compileSdk 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/targetSdk =.*/targetSdk = 36/g' {} +

      - name: Upgrade dependencies
        run: |
          flutter pub upgrade file_picker
          flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Clean build cache
        run: flutter clean

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK with version and build number
        run: |
          mkdir -p renamed
          cp build/app/outputs/flutter-apk/app-release.apk \
             renamed/GameBox-v1.0.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBox-v1.0.${{ github.run_number }}
          path: gamebox/renamed/GameBox-v1.0.${{ github.run_number }}.apk
          
